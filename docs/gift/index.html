<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>言葉のお守り - Words For Me</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#251927,#121018);color:#fff7fa;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.card{width:min(82vw,34rem);padding:2.2rem;border:1px solid #ffffff1c;border-radius:1.8rem;background:#ffffff0c;box-shadow:0 1.5rem 5rem #0008;text-align:center}.eyebrow{color:#deb3c4;font-size:.8rem;letter-spacing:.18em}.quote{font-family:"Hiragino Mincho ProN",serif;font-size:clamp(1.35rem,5vw,2rem);line-height:1.8;margin:2rem 0}.author,.note,.status{color:#cdbfc7;line-height:1.8}.note{padding:1rem;border-radius:1rem;background:#fff8;margin-top:1.5rem}</style></head>
<body><main class="card"><div class="eyebrow">WORDS FOR ME</div><h1>言葉のお守り</h1><p class="status" id="status">お守りを開いています</p><section id="gift" hidden><p>大切な人から、言葉のお守りが届いています。</p><div class="quote" id="quote"></div><div class="author" id="author"></div><div class="note" id="note" hidden></div></section></main>
<script>const API="https://quote-gift-api.mayu119.workers.dev";const id=location.pathname.split("/").filter(Boolean).pop();fetch(`${API}/v1/gifts/${encodeURIComponent(id)}`).then(async r=>{if(!r.ok)throw new Error(r.status===410?"このお守りの期限は終了しました。":"お守りを開けませんでした。");return r.json()}).then(g=>{status.hidden=true;gift.hidden=false;quote.textContent=g.quote_ja;author.textContent=g.author;if(g.sender_note){note.hidden=false;note.textContent=g.sender_note}fetch(`${API}/v1/gifts/${encodeURIComponent(id)}/opened`,{method:"POST"}).catch(()=>{})}).catch(e=>status.textContent=e.message);</script></body></html>
