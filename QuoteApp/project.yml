name: QuoteApp
options:
  bundleIdPrefix: com.antigravity
  developmentLanguage: ja
schemes:
  QuoteApp:
    build:
      targets:
        QuoteApp: all
        QuoteAppTests: [test]
    test:
      targets:
        - QuoteAppTests
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.59.2
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.10.0
targets:
  QuoteApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    resources:
      - path: Sources/Resources
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAnalytics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDevelopmentRegion: ja
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Words For Me"
        CODE_SIGN_ENTITLEMENTS: Sources/QuoteApp.entitlements
        INFOPLIST_KEY_GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: NO
        INFOPLIST_KEY_GOOGLE_ANALYTICS_IDFV_COLLECTION_ENABLED: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9W24U28U8Q
        CURRENT_PROJECT_VERSION: "12"
        MARKETING_VERSION: "1.1.4"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        PRODUCT_NAME: "MyWords"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.QuoteApp
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
  QuoteAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: QuoteApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.QuoteAppTests
        DEVELOPMENT_TEAM: 9W24U28U8Q
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MyWords.app/MyWords"
        BUNDLE_LOADER: "$(TEST_HOST)"
  com.antigravity.QuoteAppExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QuoteLiveActivityAttributes.swift
      - path: com.antigravity.QuoteApp/AppIntent.swift
      - path: com.antigravity.QuoteApp/com_antigravity_QuoteApp.swift
      - path: com.antigravity.QuoteApp/com_antigravity_QuoteAppBundle.swift
      - path: com.antigravity.QuoteApp/com_antigravity_QuoteAppControl.swift
      - path: com.antigravity.QuoteApp/com_antigravity_QuoteAppLiveActivity.swift
    resources:
      - path: com.antigravity.QuoteApp/Assets.xcassets
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sources/QuoteWidget.entitlements
        INFOPLIST_FILE: com.antigravity.QuoteApp/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9W24U28U8Q
        CURRENT_PROJECT_VERSION: "12"
        MARKETING_VERSION: "1.1.4"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.QuoteApp.QuoteWidget
        PRODUCT_NAME: QuoteWidget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
